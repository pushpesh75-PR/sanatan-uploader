name: Auto keywords
# Daily 06:30 UAE (02:30 UTC): real YouTube search terms -> description/tags of videos <=30 days old.
# Push to branch autokw/test = dry run (prints only). Manual: Actions > Auto keywords > Run workflow.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches: ["autokw/**"]
permissions:
  contents: write
concurrency:
  group: youtube-upload
  cancel-in-progress: false
jobs:
  kw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client==2.151.0 google-auth==2.36.0
      - run: python exporter.py
      - run: python autokw.py
      - name: Save state
        if: env.DRY_RUN == '0'
        run: |
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git add autokw
          git diff --cached --quiet || { git commit -qm "autokw state"; git pull -q --rebase origin main; git push origin main; }

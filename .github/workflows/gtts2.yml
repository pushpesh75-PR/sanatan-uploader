name: Gemini TTS (key 2)
on:
  push:
    branches: ["gtts2/**"]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          N=${GITHUB_REF_NAME#gtts2/}; mkdir -p ttsout
          git fetch origin gttsout-$N 2>/dev/null && git checkout FETCH_HEAD -- ttsout 2>/dev/null || true
          git reset -q; ls ttsout
      - env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY_2 }}" }
        run: python3 gemini_tts.py ${GITHUB_REF_NAME#gtts2/}
      - if: always()
        run: |
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          N=${GITHUB_REF_NAME#gtts2/}; mkdir -p ttsout
          git checkout --orphan tmp; git rm -rqf --cached .; git add ttsout; git commit -qm "gtts2 $N" || true; git push -f origin HEAD:refs/heads/gttsout-$N

name: ASR timestamps
on:
  push:
    branches: ["asr/**"]
permissions:
  contents: write
jobs:
  g:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q faster-whisper
      - run: python asrin/run.py
      - if: always()
        run: |
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git checkout --orphan asrout-tmp; git rm -rqf --cached . ; git add asrout; git commit -qm "asr out"
          git push -f origin HEAD:refs/heads/asrout-${GITHUB_REF_NAME#asr/}

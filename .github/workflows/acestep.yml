name: ACE-Step test
on:
  push:
    branches: ["ace/**"]
permissions:
  contents: write
jobs:
  ace:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ACE-Step docs (ace/docs)
        if: github.ref_name == 'ace/docs'
        run: |
          git clone --depth 1 https://github.com/ACE-Step/ACE-Step-1.5.git /tmp/ace
          mkdir -p acedocs; cp -r /tmp/ace/docs/en acedocs/ 2>/dev/null || true; cp /tmp/ace/README.md /tmp/ace/pyproject.toml acedocs/
          ls /tmp/ace; ls /tmp/ace/acestep | head -50
          (cd /tmp/ace && find . -name "*.py" -path "*acestep*" | head -80) > acedocs/pyfiles.txt
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git fetch origin main --depth=1; git checkout -B main origin/main
          git add acedocs; git commit -qm "ace-step docs"; git push origin main
      - name: Free disk
        if: startsWith(github.ref_name, 'ace/test')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo swapoff -a || true; sudo fallocate -l 14G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2; free -h; df -h /
      - uses: actions/setup-python@v5
        if: startsWith(github.ref_name, 'ace/test')
        with:
          python-version: "3.11"
      - name: Generate test songs on CPU (ace/test-*)
        if: startsWith(github.ref_name, 'ace/test')
        run: |
          set +e
          nproc; free -h
          git clone --depth 1 https://github.com/ACE-Step/ACE-Step-1.5.git /tmp/ace
          pip install -q torch==2.10.0 torchaudio==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers>=4.51.0,<4.58.0" "diffusers>=0.37.0" scipy soundfile loguru einops "accelerate>=1.12.0" diskcache numba "vector-quantize-pytorch>=1.27.15" "torchao>=0.16.0,<0.17.0" toml modelscope "pytorch-wavelets>=1.3.0" pywavelets "setuptools<72" peft matplotlib huggingface_hub torchcodec fastapi typer-slim
          pip install -q --no-deps -e /tmp/ace/acestep/third_parts/nano-vllm || true
          df -h /
          export ACESTEP_INIT_LLM=false
          set +e
          ( while true; do free -m | awk 'NR==2{print "MEM used",$3,"avail",$7}' >> /tmp/mem.log; sleep 20; done ) &
          timeout 240m python ace/gen.py ace/jobs.json /tmp/aceout > /tmp/ace.log 2>&1; echo "exit $?" >> /tmp/ace.log; tail -30 /tmp/mem.log >> /tmp/ace.log
          tail -80 /tmp/ace.log
          mkdir -p aceout; find /tmp/aceout -type f \( -name "*.mp3" -o -name "*.wav" -o -name "*.flac" \) -exec cp {} aceout/ \; ; cp /tmp/ace.log aceout/
          ls -la aceout
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git checkout -B ace-out
          git add aceout; git commit -qm "ace test output"; git push -f origin ace-out

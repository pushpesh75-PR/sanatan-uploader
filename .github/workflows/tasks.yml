name: Channel tasks

# Push a branch named task/export  -> save all channel videos to channel/videos.json (read-only)
# Push a branch named task/update-<name> containing changes/changes.json + changes/approved.txt
#                                    -> change metadata of the approved videos
on:
  push:
    branches: ["task/**"]

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ contains(github.ref_name, 'katha') && secrets.YT_REFRESH_TOKEN_KATHA || secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client==2.151.0 google-auth==2.36.0
      - name: Export channel videos
        if: github.ref_name == 'task/export'
        run: |
          python exporter.py
          cp channel/videos.json /tmp/videos.json; cp channel/channel.json /tmp/channel.json
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git fetch origin main --depth=1; git checkout -B main origin/main
          mkdir -p channel; cp /tmp/videos.json channel/videos.json; cp /tmp/channel.json channel/channel.json
          git add channel
          git diff --cached --quiet || { git commit -m "channel export"; git push origin main; }
      - name: Analytics report (task/analytics)
        if: github.ref_name == 'task/analytics'
        run: |
          python exporter.py
          python analytics.py
          for f in videos channel analytics; do cp channel/$f.json /tmp/$f.json; done
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git fetch origin main --depth=1; git checkout -B main origin/main
          mkdir -p channel; for f in videos channel analytics; do cp /tmp/$f.json channel/$f.json; done
          git add channel
          git diff --cached --quiet || { git commit -m "analytics report"; git push origin main; }
      - name: Deep research (task/deep)
        if: github.ref_name == 'task/deep'
        run: |
          pip install pytrends==4.9.2 || true
          python exporter.py
          python analytics.py
          python deep.py
          mkdir -p /tmp/out/thumbs
          python - <<'PY'
          import json, urllib.request
          v = json.load(open("channel/videos.json"))["videos"]
          d = json.load(open("channel/deep.json"))
          ids = [("our_" + x["id"], x["id"]) for x in v if x.get("privacy") == "public"]
          top = sorted([k for k, x in d["videos"].items() if x["sec"] >= 240], key=lambda k: -d["videos"][k]["views"])[:70]
          ids += [("comp_" + k, k) for k in top]
          for name, vid in ids:
              for q in ("maxresdefault", "hqdefault"):
                  try:
                      b = urllib.request.urlopen(f"https://i.ytimg.com/vi/{vid}/{q}.jpg", timeout=20).read()
                      open(f"/tmp/out/thumbs/{name}.jpg", "wb").write(b); break
                  except Exception:
                      pass
          PY
          for f in videos channel analytics deep; do cp channel/$f.json /tmp/out/$f.json; done
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git fetch origin main --depth=1; git checkout -B main origin/main
          mkdir -p channel/thumbs; cp /tmp/out/*.json channel/; cp /tmp/out/thumbs/* channel/thumbs/ 2>/dev/null || true
          git add channel
          git diff --cached --quiet || { git commit -qm "deep research data"; git push origin main; }
      - name: Channel profile (task/chan)
        if: github.ref_name == 'task/chan'
        run: |
          python chan.py
          mkdir -p /tmp/ch; cp channel/chan_*.json /tmp/ch/
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git fetch origin main --depth=1; git checkout -B main origin/main
          mkdir -p channel; cp /tmp/ch/*.json channel/
          git add channel
          git diff --cached --quiet || { git commit -qm "channel profile"; git push origin main; }
      - name: Peer cohort (task/peers)
        if: github.ref_name == 'task/peers'
        run: |
          python peers.py
          cp channel/peers.json /tmp/peers.json
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git fetch origin main --depth=1; git checkout -B main origin/main
          cp /tmp/peers.json channel/peers.json
          git add channel/peers.json
          git diff --cached --quiet || { git commit -qm "peer cohort"; git push origin main; }
      - name: Channel fixes (task/fix-channel)
        if: github.ref_name == 'task/fix-channel'
        run: |
          python fix_channel.py
          cp channel/fix_report.json /tmp/fix_report.json
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git fetch origin main --depth=1; git checkout -B main origin/main
          cp /tmp/fix_report.json channel/fix_report.json
          git add channel/fix_report.json
          git diff --cached --quiet || { git commit -qm "channel fixes report"; git push origin main; }
      - name: Competitor scan (task/competitors)
        if: github.ref_name == 'task/competitors'
        run: |
          python competitors.py
          cp channel/competitors.json /tmp/competitors.json
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git fetch origin main --depth=1; git checkout -B main origin/main
          mkdir -p channel; cp /tmp/competitors.json channel/competitors.json
          git add channel/competitors.json
          git diff --cached --quiet || { git commit -m "competitor scan"; git push origin main; }
      - name: Fetch clips from URLs (task/fetch-<name>)
        if: startsWith(github.ref_name, 'task/fetch')
        run: |
          name="${GITHUB_REF_NAME#task/fetch-}"
          mkdir -p clips
          i=0
          while read -r label url; do
            [ -z "$url" ] && continue
            curl -fsSL --retry 3 -o "clips/${label}.mp4" "$url"
            ls -la "clips/${label}.mp4"
          done < fetch/urls.txt
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git checkout -B "clips/${name}"
          git rm -rq --cached fetch || true
          git add clips
          git commit -qm "clips: ${name}"
          git push -f origin "clips/${name}"
      - name: Update video metadata
        if: startsWith(github.ref_name, 'task/update')
        run: python updater.py
      - name: Delete task branch
        if: success()
        run: git push origin --delete "${{ github.ref_name }}"
      - name: Who am I (task/whoami-*)
        if: startsWith(github.ref_name, 'task/whoami')
        run: |
          python - <<'PY'
          import json, os
          from uploader import service
          yt = service()
          c = yt.channels().list(part="snippet,statistics,brandingSettings", mine=True).execute()["items"][0]
          n = os.environ["GITHUB_REF_NAME"].split("whoami-")[-1]
          os.makedirs("channel", exist_ok=True)
          json.dump({"id": c["id"], "title": c["snippet"]["title"], "custom": c["snippet"].get("customUrl"), "stats": c["statistics"]}, open(f"/tmp/who_{n}.json", "w"), ensure_ascii=False)
          print(open(f"/tmp/who_{n}.json").read())
          PY
          n=${GITHUB_REF_NAME#task/whoami-}
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git fetch origin main --depth=1; git checkout -B main origin/main
          mkdir -p channel; cp /tmp/who_$n.json channel/whoami_$n.json; git add channel; git commit -qm "whoami $n"; git push origin main

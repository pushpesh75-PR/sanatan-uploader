name: Channel tasks

# Push a branch named task/export  -> save all channel videos to channel/videos.json (read-only)
# Push a branch named task/update-<name> containing changes/changes.json + changes/approved.txt
#                                    -> change metadata of the approved videos
on:
  push:
    branches: ["task/**"]

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client==2.151.0 google-auth==2.36.0
      - name: Export channel videos
        if: github.ref_name == 'task/export'
        run: |
          python exporter.py
          cp channel/videos.json /tmp/videos.json; cp channel/channel.json /tmp/channel.json
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git fetch origin main --depth=1; git checkout -B main origin/main
          mkdir -p channel; cp /tmp/videos.json channel/videos.json; cp /tmp/channel.json channel/channel.json
          git add channel
          git diff --cached --quiet || { git commit -m "channel export"; git push origin main; }
      - name: Analytics report (task/analytics)
        if: github.ref_name == 'task/analytics'
        run: |
          python exporter.py
          python analytics.py
          for f in videos channel analytics; do cp channel/$f.json /tmp/$f.json; done
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git fetch origin main --depth=1; git checkout -B main origin/main
          mkdir -p channel; for f in videos channel analytics; do cp /tmp/$f.json channel/$f.json; done
          git add channel
          git diff --cached --quiet || { git commit -m "analytics report"; git push origin main; }
      - name: Competitor scan (task/competitors)
        if: github.ref_name == 'task/competitors'
        run: |
          python competitors.py
          cp channel/competitors.json /tmp/competitors.json
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git fetch origin main --depth=1; git checkout -B main origin/main
          mkdir -p channel; cp /tmp/competitors.json channel/competitors.json
          git add channel/competitors.json
          git diff --cached --quiet || { git commit -m "competitor scan"; git push origin main; }
      - name: Fetch clips from URLs (task/fetch-<name>)
        if: startsWith(github.ref_name, 'task/fetch')
        run: |
          name="${GITHUB_REF_NAME#task/fetch-}"
          mkdir -p clips
          i=0
          while read -r label url; do
            [ -z "$url" ] && continue
            curl -fsSL --retry 3 -o "clips/${label}.mp4" "$url"
            ls -la "clips/${label}.mp4"
          done < fetch/urls.txt
          git config user.name "uploader-bot"; git config user.email "uploader-bot@users.noreply.github.com"
          git checkout -B "clips/${name}"
          git rm -rq --cached fetch || true
          git add clips
          git commit -qm "clips: ${name}"
          git push -f origin "clips/${name}"
      - name: Update video metadata
        if: startsWith(github.ref_name, 'task/update')
        run: python updater.py
      - name: Delete task branch
        if: success()
        run: git push origin --delete "${{ github.ref_name }}"
